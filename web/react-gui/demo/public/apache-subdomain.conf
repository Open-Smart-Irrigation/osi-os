# Apply inside a static simulator subdomain's document root. Define STAGING only
# on the staging virtual host; production never receives the staging parent.
<IfModule mod_headers.c>
  <IfDefine STAGING>
    Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; frame-src 'self'; frame-ancestors 'self' https://opensmartirrigation.org https://staging.opensmartirrigation.org; base-uri 'none'; form-action 'none'; object-src 'none'; worker-src 'none'"
  </IfDefine>
  <IfDefine !STAGING>
    Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; frame-src 'self'; frame-ancestors 'self' https://opensmartirrigation.org; base-uri 'none'; form-action 'none'; object-src 'none'; worker-src 'none'"
  </IfDefine>
  Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Cache-Control "no-store" "expr=%{REQUEST_URI} =~ m#^/simulator/(?:|index\\.html|app\\.html)$#"
  Header always set Cache-Control "public, max-age=31536000, immutable" "expr=%{REQUEST_URI} =~ m#^/simulator/assets/.+-[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9]+$#"
</IfModule>
