# Apply inside the deployed /simulator/ directory.
<IfModule mod_headers.c>
  Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; frame-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; worker-src 'none'"
  Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Cache-Control "no-store" "expr=%{REQUEST_URI} =~ m#^/simulator/(?:|index\\.html|app\\.html)$#"
  Header always set Cache-Control "public, max-age=31536000, immutable" "expr=%{REQUEST_URI} =~ m#^/simulator/assets/.+-[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9]+$#"
</IfModule>
