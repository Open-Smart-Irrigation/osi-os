name: GUI Typecheck & Unit Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
defaults:
  run:
    working-directory: web/react-gui
jobs:
  # The supported build toolchain: Node 22 with its bundled npm 10. The
  # lockfile is written by npm 10; a lockfile regenerated by a newer npm can
  # drop entries npm 10 needs, and npm ci here fails on it.
  typecheck:
    runs-on: ubuntu-latest
    # A hung node:test file would otherwise hold the job for six hours.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --version && npm --version
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/react-gui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Chromium for conditional irrigation browser tests
        run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run demo:test
      - name: Release GUI package smoke
        run: node scripts/run-mobile-tension-build-matrix.mjs --release-only
      - name: Conditional irrigation browser tests
        run: npm run test:browser:conditional
      - name: Device registration browser tests
        run: npm run test:browser:device-registration
  # Production build of the dashboard. The typecheck job above never runs
  # the bundler, so a broken import or an unresolved module is invisible to it.
  gui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run build -- --manifest .vite/manifest.json
        env:
          VITE_MOBILE_HISTORY_INTERNAL: 'true'
          VITE_MOBILE_HISTORY_INTERNAL_DIAGNOSTICS: 'true'
          VITE_HISTORY_UPLOT_SOIL_ENABLED: 'true'
      - run: node scripts/verify-release-phone-chunks.mjs
  # Upgrade lane: does the same lockfile still install on the next Node LTS
  # (npm 11)? Informational: with job-level continue-on-error a failure
  # shows this job red in the checks list while the workflow run stays
  # green. Do not make it a required check.
  install-next-lts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --version && npm --version
      - run: npm ci
