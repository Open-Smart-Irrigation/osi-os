name: GUI Typecheck & Unit Tests
on:
  push:
    branches: [ main, master, AgroLink, 'feat/**', 'fix/**', 'docs/**' ]
  pull_request:
  workflow_dispatch:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
