name: GUI Typecheck & Unit Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
defaults:
  run:
    working-directory: web/react-gui
jobs:
  # The supported build toolchain: Node 22 with its bundled npm 10. The
  # lockfile is written by npm 10; a lockfile regenerated by a newer npm can
  # drop entries npm 10 needs, and npm ci here fails on it.
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run demo:test
  # Upgrade lane: does the same lockfile still install on the next Node LTS
  # (npm 11)? Informational: with job-level continue-on-error a failure
  # shows this job red in the checks list while the workflow run stays
  # green. Do not make it a required check.
  install-next-lts:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --version && npm --version
      - run: npm ci
