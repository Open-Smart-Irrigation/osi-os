name: Release Runtime Smoke

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  OSI_SMOKE_NODE_VERSION: '20.18.3'
  OSI_SMOKE_IMAGE_NODE_RED_VERSION: '3.1.15'
  OSI_SMOKE_STOCK_NODE_RED_VERSION: '4.0.9'

jobs:
  release-runtime-smoke:
    name: release-runtime-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.OSI_SMOKE_NODE_VERSION }}
          cache: npm
          cache-dependency-path: scripts/fixtures/release-smoke/package-lock.json
      - name: Install SQLite CLI
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - name: Install pinned runtime
        run: npm ci --prefix scripts/fixtures/release-smoke --no-audit --no-fund
      - name: Node file serializes the flows' SQLite connection (three package layouts)
        run: node --test scripts/test-sqlite-serialize-node-file.js
      - name: Deploy keeps a working node file when its fetch fails
        run: node --test scripts/test-deploy-node-files.js
      - name: Failure-list policy
        run: node --test --test-concurrency=2 scripts/test-release-smoke-policy.js
      - name: Reject broken late and caught handlers (serial negative controls)
        run: node scripts/test-release-smoke-controls.js
      - name: Start shipped software and exercise HTTP and radio boundaries
        run: node scripts/test-release-smoke.js
      - name: Refuse a release with known failures
        run: node scripts/release-smoke-gate.js --ci
      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-runtime-smoke
          path: |
            /tmp/osi-release-smoke-*/results.json
            /tmp/osi-release-smoke-*/runtime.log
            /tmp/osi-release-smoke-*/seed.log
            /tmp/osi-release-smoke-*/summary.json
            /tmp/osi-release-smoke-*/install.log
          retention-days: 7

  release-stock-runtime-smoke:
    name: release-stock-runtime-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.OSI_SMOKE_NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            scripts/fixtures/release-smoke-stock/package-lock.json
            conf/full_raspberrypi_bcm27xx_bcm2712/files/usr/share/node-red/package-lock.json
      - name: Install SQLite CLI
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - name: Install pinned stock firmware runtime (no SQLite)
        run: npm ci --prefix scripts/fixtures/release-smoke-stock --omit=dev --no-audit --no-fund
      - name: Start stock runtime with the deploy-style user install
        run: node scripts/test-release-smoke.js --runtime=stock
      - name: Reject broken late and caught stock handlers (serial negative controls)
        run: node scripts/test-release-smoke-controls.js --runtime=stock
      - name: Refuse a release with known failures on either runtime
        run: node scripts/release-smoke-gate.js --ci
      - name: Preserve stock runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-stock-runtime-smoke
          path: |
            /tmp/osi-release-smoke-*/results.json
            /tmp/osi-release-smoke-*/runtime.log
            /tmp/osi-release-smoke-*/seed.log
            /tmp/osi-release-smoke-*/summary.json
            /tmp/osi-release-smoke-*/install.log
          retention-days: 7
