name: Valve Wire Regressions

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  actuation-text-caps:
    name: actuation-text-caps
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - name: Valve actuation outgoing text caps, both profiles
        run: node --test scripts/test-valve-actuation-text-caps.js

  schedule-timestamp-wire-format:
    name: schedule-timestamp-wire-format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - name: Valve schedule outgoing timestamp, both profiles
        run: node --test scripts/test-valve-schedule-timestamp-wire-format.js
