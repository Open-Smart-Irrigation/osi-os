name: Image Firewall
on:
  push:
    branches: [main, master, 'release/0.8.3']
  pull_request:
    branches: [main, master, 'release/0.8.3']
jobs:
  image-firewall:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the Tailscale input rule and profile parity
        run: node --test scripts/test-tailscale-firewall-default.js
      - if: github.repository == 'Open-Smart-Irrigation/osi-os'
        run: node scripts/verify-doc-hygiene.js
