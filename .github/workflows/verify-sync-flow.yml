name: Sync Flow Verifier
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  verify-sync-flow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # full history: test-sync-history-schema.js resolves the pinned
          # pre-history-sync baseline SHA (issue #84) via `git show <sha>:...`;
          # a shallow clone would silently SKIP the upgrade-path leg.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install sqlite3 CLI
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      # The repo's main local gate, promoted to CI after issue #84 proved it can
      # break on main invisibly (it chains comm-contract, DB-schema consistency,
      # history schema/worker tests, history API contract, helper tests, and
      # profile parity). Must end with "All parity checks passed."
      - name: Scoped-access endpoint ratchet
        run: node scripts/verify-scoped-access.js
      - run: node scripts/verify-sync-flow.js
      - name: Sync outbox JSON guard
        run: node scripts/test-sync-outbox-json-guard.js
      # WATERMARK LSN50 profile 3: FPort 11 dispatch in lsn50-decode-fn, the
      # config-query drop and watermark-ingest-fn, run against the real
      # osi-db-helper facade; FPort 2 formattedData pinned to origin/main; Build
      # Telemetry drops FPort 11 before its raw decoder.
      - run: node scripts/test-watermark-ingest-flow.js
      # WATERMARK calibration GET/PUT/DELETE through the whole chain (http in ->
      # scoped-device-config-guard -> watermark-cal-fn), flag off and scoped,
      # plus the soil-depth PUT (-> put-soil-depth-fn) the depth form uses.
      - run: node scripts/test-watermark-calibration-routes.js
      # Standalone inventory: each command passed locally within the 60 s cap
      # and is not invoked by another workflow step or npm script.
      - name: Standalone script inventory pass set
        run: |
          node scripts/test-account-link-legacy-cloud.js
          node scripts/test-audit-schema.js
          node scripts/test-command-ack-mark-delivered.js
          node scripts/test-delete-device-flow.js
          node scripts/test-deploy-init-log-check.js
          node scripts/test-improvement-requests-schema.js
          node scripts/test-installation-helper.js
          node scripts/test-installation-recovery-flow.js
          node scripts/test-installation-recovery-schema.js
          node scripts/test-installation-revision-command.js
          node scripts/test-migration-helpers.js
          node scripts/test-node-red-admin-root-off.js
          node scripts/test-protected-command-replay-chain.js
          node scripts/test-protected-config-command-dispatch.js
          node scripts/test-radio-chirpstack.js
          node scripts/test-radio-flow.js
          node scripts/test-radio-history-flow-integration.js
          node scripts/test-radio-history.js
          node scripts/test-sdi12-recipe-flow.js
          node scripts/test-sdi12-recipe-schema.js
          node scripts/test-sdi12-registration.js
          node scripts/test-sentek-vwc-vic-schema.js
          node scripts/test-strega-gen2-reconcile.js
          node scripts/test-sync-history-durable-flow.js
          node scripts/test-sync-history-durable-integration.js
          node scripts/test-sync-token-refresh-window.js
          node scripts/test-verify-flows-output-arity.js
          node scripts/test-watermark-calibration-bootstrap.js
          node scripts/test-watermark-cloud-command-auth.js
          node scripts/test-watermark-cloud-command-path.js
          node scripts/test-watermark-contact-payload.js
          node scripts/test-zone-device-assignment-flow.js
          node scripts/test-zone-timezone-route.js
          node scripts/verify-chameleon-calibration.js
          node scripts/verify-lsn50-chameleon-persistence.js
          node scripts/verify-module-file-deploy-coverage.js
          node scripts/verify-s2120-gust-fix.js
      # WATERMARK protected configuration commands (SET/DELETE_WATERMARK_CALIBRATION,
      # SET_CHAMELEON_CONFIG, UPSERT_DEVICE_SOIL_DEPTHS): the receiver and the command
      # ledger on the seed schema, including a rejected or conflicting command that
      # must not block a successor at the same base, and the dispatch timeouts.
      # bcm2712 only: verify-profile-parity.js above proves the mirror byte-identical.
      - name: WATERMARK protected command receiver and ledger
        run: |
          node --test conf/full_raspberrypi_bcm27xx_bcm2712/files/usr/share/node-red/osi-watermark-helper/commands.test.js \
            scripts/test-protected-config-command-dispatch-timeouts.test.js
      # Soil history through the shipped History API Router: per-device SWT3
      # filtering for a plain LSN50, soil rollups kept for zones without one, and a
      # temperature-enabled WATERMARK node kept as a soil source (cards, series, CSV).
      - name: Soil history source and rollup rule
        run: node --test scripts/test-history-router-soil-projection.js
      # The staged, digest-pinned command-ledger install in deploy.sh (activation
      # after the schema migration, stale stage cleanup), the fetch list and the
      # payload lifecycle. The pin check fails when a ledger, binding or installer
      # change does not update its COMMAND_LEDGER_*_SHA256 in deploy.sh.
      - name: Staged command-ledger deploy
        run: |
          node --test scripts/deploy-command-ledger-dependency.test.js \
            scripts/deploy-fetch-list.test.js \
            scripts/deploy-payload-lifecycle.test.js
      # Migration 0068 rehearsal (bound applied-command columns, calibration-only
      # outbox triggers, live and tombstone events, readings stay local) and the
      # journal v2 replication flows migration this branch touches.
      - name: WATERMARK migration rehearsal and flows migration
        run: |
          node --test scripts/rehearse-watermark-cloud-parity-migration.test.js \
            scripts/migrate-flows-journal-v2-replication.test.js
      # RAK10701 field-tester downlink encoder (fPort 2, six-byte reply): sequence
      # id modulo, both RSSI clamps, the 250 m/32 km distance quantisation, and
      # both directions of position-unknown degradation. This is a node:test file
      # under osi-radio-helper/, not a scripts/ wrapper, so it needs its own step.
      # bcm2712 only: verify-profile-parity.js, chained by verify-sync-flow.js
      # above, already proves the bcm2709 copy is byte-identical.
      - name: Field tester reply encoder
        run: node --test conf/full_raspberrypi_bcm27xx_bcm2712/files/usr/share/node-red/osi-radio-helper/fieldtester.test.js
      # Parse-checks every function node's func/initialize/finalize in all
      # shipped flows.json profiles. Added after issue #6: dendro-raw-fn
      # shipped with a corrupted regex Node-RED could not compile, so its
      # HTTP route hung (curl exit 28) and no verifier noticed.
      - name: Function-node parse check (all flows.json profiles)
        run: |
          node scripts/verify-flows-fn-parse.js
          node --test scripts/verify-flows-fn-parse.test.js
      # Statically sweeps every function node's `return [...]`/`node.send([...])`
      # arrays for an element count exceeding the node's real wired output
      # count. Added after F28 (2026-09-17 overnight stabilization,
      # harness run on the customer test gateway, run-full2/Z2.md): assign-device-update declared
      # outputs:1 but returned [null, msg] on its not-found path, so the 404
      # had no wire to travel on and PUT .../devices/:deveui for an unknown
      # DevEUI hung forever. No existing verifier checked this.
      - name: Function-node output arity check (canonical flows.json)
        run: node scripts/verify-flows-output-arity.js
      - name: Skill-library symlink parity (.agents/skills must alias .claude/skills)
        run: |
          test "$(readlink .agents/skills)" = "../.claude/skills"
          # gitignore must stay narrow: arbitrary .agents/ files ignored, symlink tracked
          git check-ignore -q .agents/notes.txt
          git ls-files --error-unmatch .agents/skills > /dev/null
      # The Terra zone-config command path: the acceptance generator pins the
      # cross-repo contract fixture, and the flow test runs the real generated
      # function-node source to prove a legacy zone-config command still passes
      # through to the v1 router instead of being swallowed by the Terra applier.
      - name: Terra zone-config command gates
        run: |
          node --test scripts/test-terra-selection-edge-acceptance.js \
            scripts/test-terra-zone-config-command-flow.js
          node --test scripts/osi-lib-binding-audit.test.js
          node scripts/test-flows-wiring.js
      # Rename routes, the entity-name command path and the create/legacy name
      # rule. Each runs the shipped function-node source against an in-memory
      # SQLite fixture through scripts/lib/scoped-access-harness.js.
      - name: Zone and device rename gates
        run: |
          node --test scripts/test-zone-rename-route.js \
            scripts/test-device-rename-route.js \
            scripts/test-entity-name-command-path.js \
            scripts/test-entity-name-create-paths.js \
            scripts/test-legacy-upsert-zone-name.js
      # F128: a local zone create/delete must ping the outbox flush gate over the
      # link pair instead of waiting up to 30 s for the "Flush Sync Outbox" inject.
      # Pins the wiring (both scoped and legacy routes tap it) and the gate's
      # bounded coalescing behaviour against the shipped function-node source.
      - name: Event-driven outbox flush gate
        run: node --test scripts/test-outbox-event-flush.js
      # F140: the zone timezone and location routes must bump sync_version, or the
      # outbox trigger emits at a version the cloud already applied and the change is
      # dead-lettered as equal_version_payload_conflict. Runs the shipped UPDATE against
      # the bundled farming.db and its real triggers.
      - name: Zone write routes emit at a new sync version
        run: node --test scripts/test-zone-update-sync-version.js
      # Weather data view: the zone weather_source round trip -- the 0065 zone
      # trigger on the seven bundled databases, the zone route and list, and the
      # legacy command path, each against the shipped source.
      - name: Zone weather provider round trip
        run: node --test scripts/test-zone-weather-source.js
      # Daily agronomy parity: the zone stage start date -- the 0066 zone trigger on
      # the seven bundled databases and the legacy command path, against the shipped source.
      - name: Zone stage start date round trip
        run: node --test scripts/test-stage-started-on-migration.js scripts/test-legacy-upsert-zone-config.js
      # Daily agronomy parity: the daily record's migration-owned outbox triggers
      # (0067), the writer's versions and retraction, and the bootstrap list.
      - name: Daily agronomy record sync
        run: node --test scripts/test-zone-agronomy-sync-triggers.js
      # pipefail: without it the step took tee's exit status, and the grep
      # also matched the failure message, so a failing upgrade leg stayed green.
      - name: Guard against silent upgrade-leg skip
        run: |
          set -o pipefail
          node scripts/test-sync-history-schema.js 2>&1 | tee /tmp/schema.out
          grep -qx 'OK sync history schema base seed + history migration' /tmp/schema.out
