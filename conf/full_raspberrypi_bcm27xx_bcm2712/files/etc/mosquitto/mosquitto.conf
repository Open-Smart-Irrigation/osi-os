log_dest syslog

# The broker stays up while Node-RED restarts. Its persistent MQTT session
# retains QoS 1 uplinks in memory; disk persistence is a separate concern.
persistence false
# Per client: 60 s at 6 uplinks/s = 360 messages. The byte cap also leaves
# room for 360 integration envelopes of 16 KiB each, with bounded memory.
max_queued_messages 1000
max_queued_bytes 16777216

listener 1883 
allow_anonymous true
